sheet.instructions=Guarde esta hoja en un lugar seguro, lejos del ordenador y del disco de copias.\nPara recuperar sus archivos en un ordenador nuevo: conecte el disco de copias, inicie Copias & Sincronización, elija Copias > Abrir copia existente y la carpeta amadeos-backup del disco. Escriba esta contraseña cuando se la pida.\nLa copia es un repositorio restic estándar, así que el programa restic también puede leerla en cualquier otro sistema.
sheet.job-name=Hoja de recuperación de la copia
readme.text=Esta carpeta contiene copias cifradas hechas con Copias & Sincronización en amadeOS.\n\nLa carpeta {0}/{1} es un repositorio de copias. No cambie ni borre archivos en ella, o las copias se vuelven ilegibles.\n\nPara recuperar archivos: inicie Copias & Sincronización, elija Copias > Abrir copia existente y esta carpeta. Necesita la contraseña de la hoja de recuperación.\n\nEl repositorio tiene el formato restic estándar, así que en otro sistema también puede usar: restic --repo {1} snapshots

