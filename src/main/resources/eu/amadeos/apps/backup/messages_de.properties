password.intro=Ihre Sicherung wird mit diesem Passwort verschlüsselt. Es liegt in Ihrem Schlüsselbund, Sie müssen es also nicht eintippen. Ohne das Passwort kann niemand die Sicherung lesen, auch Sie nicht auf einem neuen Rechner. Drucken Sie deshalb das Notfallblatt und bewahren Sie es sicher auf.
