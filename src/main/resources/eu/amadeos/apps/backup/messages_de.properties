sheet.job=Sicherung: {0}
sheet.where=Wo: {0}
sheet.date=Erstellt am: {0}
sheet.password=Passwort
sheet.instructions=Bewahren Sie dieses Blatt sicher auf, getrennt vom Rechner und vom Sicherungsdatenträger.\nSo bekommen Sie Ihre Dateien auf einem neuen Rechner zurück: Schließen Sie den Sicherungsdatenträger an, starten Sie Sicherung & Abgleich, wählen Sie Sicherung > Vorhandene Sicherung öffnen und den Ordner amadeos-backup auf dem Datenträger. Geben Sie dieses Passwort ein, wenn danach gefragt wird.\nDie Sicherung ist ein übliches restic-Repository, das Programm restic kann sie also auch auf jedem anderen System lesen.
sheet.job-name=Notfallblatt der Sicherung
readme.text=Dieser Ordner enthält verschlüsselte Sicherungen, gemacht mit Sicherung & Abgleich unter amadeOS.\n\nDer Ordner {0}/{1} ist ein Sicherungs-Repository. Ändern oder löschen Sie darin keine Dateien, sonst werden die Sicherungen unlesbar.\n\nSo holen Sie Dateien zurück: Starten Sie Sicherung & Abgleich, wählen Sie Sicherung > Vorhandene Sicherung öffnen und diesen Ordner. Sie brauchen das Passwort vom Notfallblatt.\n\nDas Repository hat das übliche restic-Format, auf einem anderen System geht also auch: restic --repo {1} snapshots

