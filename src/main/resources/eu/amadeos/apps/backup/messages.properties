sheet.instructions=Keep this sheet in a safe place, away from the computer and the backup disk.\nTo get your files back on a new computer: connect the backup disk, start Backup & Sync, choose Backup > Open Existing Backup and pick the folder amadeos-backup on the disk. Enter this password when asked.\nThe backup is a standard restic repository, so the program restic can also read it on any other system.
sheet.job-name=Backup recovery sheet
readme.text=This folder holds encrypted backups made with Backup & Sync on amadeOS.\n\nThe folder {0}/{1} is one backup repository. Do not change or delete files in it, or the backups become unreadable.\n\nTo get files back: start Backup & Sync, choose Backup > Open Existing Backup and pick this folder. You need the password from the recovery sheet.\n\nThe repository is in the standard restic format, so on another system you can also use: restic --repo {1} snapshots

