sheet.password=Mot de passe
sheet.instructions=Rangez cette fiche en lieu sûr, loin de l'ordinateur et du disque de sauvegarde.\nPour récupérer vos fichiers sur un nouvel ordinateur : branchez le disque de sauvegarde, lancez Sauvegarde & Synchro, choisissez Sauvegarde > Ouvrir une sauvegarde existante et le dossier amadeos-backup du disque. Entrez ce mot de passe quand il est demandé.\nLa sauvegarde est un dépôt restic standard, le programme restic peut donc aussi la lire sur tout autre système.
sheet.job-name=Fiche de secours de la sauvegarde
readme.text=Ce dossier contient des sauvegardes chiffrées faites avec Sauvegarde & Synchro sous amadeOS.\n\nLe dossier {0}/{1} est un dépôt de sauvegarde. N'y changez ni n'effacez aucun fichier, sinon les sauvegardes deviennent illisibles.\n\nPour récupérer des fichiers : lancez Sauvegarde & Synchro, choisissez Sauvegarde > Ouvrir une sauvegarde existante et ce dossier. Il vous faut le mot de passe de la fiche de secours.\n\nLe dépôt est au format restic standard, sur un autre système vous pouvez donc aussi utiliser : restic --repo {1} snapshots

