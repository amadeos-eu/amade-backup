password.intro=Votre sauvegarde est chiffrée avec ce mot de passe. Il est gardé dans votre trousseau, vous n'avez donc pas à le taper. Sans lui personne ne peut lire la sauvegarde, pas même vous sur un nouvel ordinateur : imprimez la fiche de secours et rangez-la en lieu sûr.
