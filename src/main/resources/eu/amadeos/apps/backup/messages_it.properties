sheet.title=Backup di amadeOS: foglio di recupero
sheet.job=Backup: {0}
sheet.where=Dove: {0}
sheet.date=Fatto il: {0}
sheet.password=Password
sheet.instructions=Conservate questo foglio in un posto sicuro, lontano dal computer e dal disco di backup.\nPer recuperare i file su un computer nuovo: collegate il disco di backup, avviate Backup & Sincronizzazione, scegliete Backup > Apri backup esistente e la cartella amadeos-backup sul disco. Inserite questa password quando viene chiesta.\nIl backup è un repository restic standard, quindi il programma restic può leggerlo anche su qualsiasi altro sistema.
sheet.job-name=Foglio di recupero del backup
readme.text=Questa cartella contiene backup cifrati fatti con Backup & Sincronizzazione su amadeOS.\n\nLa cartella {0}/{1} è un repository di backup. Non cambiate e non cancellate file al suo interno, altrimenti i backup diventano illeggibili.\n\nPer recuperare file: avviate Backup & Sincronizzazione, scegliete Backup > Apri backup esistente e questa cartella. Serve la password del foglio di recupero.\n\nIl repository è nel formato restic standard, quindi su un altro sistema potete usare anche: restic --repo {1} snapshots

