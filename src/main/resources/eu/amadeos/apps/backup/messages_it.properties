password.intro=Il backup è cifrato con questa password. Viene tenuta nel portachiavi, quindi non dovete digitarla. Senza di essa nessuno può leggere il backup, nemmeno voi su un computer nuovo: stampate il foglio di recupero e conservatelo in un posto sicuro.
